name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  build-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sales-rader-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sales-rader-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sales-rader-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sales-rader-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: [changes, build-backend, build-frontend]
    # 빌드가 하나라도 실패/취소되면 배포하지 않음. 변경 없는(skip) 서비스가 있어도,
    # compose만 바뀐 경우에도 배포는 진행되도록 always() 사용.
    if: ${{ always() && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/sales-rader

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TARGET_SITE_URL: ${{ secrets.TARGET_SITE_URL }}
          TARGET_SALES_URL: ${{ secrets.TARGET_SALES_URL }}
          TARGET_LOGIN_ID: ${{ secrets.TARGET_LOGIN_ID }}
          TARGET_LOGIN_PW: ${{ secrets.TARGET_LOGIN_PW }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          GIT_SHA: ${{ github.sha }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,SUPABASE_URL,SUPABASE_KEY,TARGET_SITE_URL,TARGET_SALES_URL,TARGET_LOGIN_ID,TARGET_LOGIN_PW,FRONTEND_ORIGIN,GIT_SHA,BACKEND_CHANGED,FRONTEND_CHANGED,DISPATCH
          script: |
            set -eu
            cd /opt/sales-rader

            # .env에 KEY=VALUE를 멱등하게 upsert (기존 줄 제거 후 추가)
            upsert() {
              key="$1"; val="$2"
              touch .env
              grep -v "^${key}=" .env > .env.tmp 2>/dev/null || true
              echo "${key}=${val}" >> .env.tmp
              mv .env.tmp .env
            }

            # 런타임 시크릿 + 레지스트리 네임스페이스 (매 배포 갱신)
            upsert DOCKERHUB_USERNAME "$DOCKERHUB_USERNAME"
            upsert SUPABASE_URL "$SUPABASE_URL"
            upsert SUPABASE_KEY "$SUPABASE_KEY"
            upsert TARGET_SITE_URL "$TARGET_SITE_URL"
            upsert TARGET_SALES_URL "$TARGET_SALES_URL"
            upsert TARGET_LOGIN_ID "$TARGET_LOGIN_ID"
            upsert TARGET_LOGIN_PW "$TARGET_LOGIN_PW"
            upsert FRONTEND_ORIGIN "$FRONTEND_ORIGIN"

            # 이번에 빌드된 서비스의 태그만 새 sha로 핀 (나머지는 기존 태그 유지)
            if [ "$BACKEND_CHANGED" = "true" ] || [ "$DISPATCH" = "true" ]; then upsert BACKEND_TAG "$GIT_SHA"; fi
            if [ "$FRONTEND_CHANGED" = "true" ] || [ "$DISPATCH" = "true" ]; then upsert FRONTEND_TAG "$GIT_SHA"; fi

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose pull
            docker compose up -d
            docker logout
            docker image prune -f
